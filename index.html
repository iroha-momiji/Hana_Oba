    function FitTitle({ text, className = "", max = 128, min = 28, as: Tag = "span", style = {} }) {
      const ref = useRef(null);
      const [measuredSize, setMeasuredSize] = useState(null);
      const vw = Math.max(4.2, Math.min(11, 132 / Math.max(text.length, 1)));

      useLayoutEffect(() => {
        const element = ref.current;
        if (!element) return;

        const fit = () => {
          const parentWidth = element.parentElement?.clientWidth || element.clientWidth;
          if (!parentWidth) return;

          const computed = window.getComputedStyle(element);
          const probe = document.createElement("span");
          probe.textContent = text;
          probe.style.position = "absolute";
          probe.style.visibility = "hidden";
          probe.style.whiteSpace = "nowrap";
          probe.style.fontFamily = computed.fontFamily;
          probe.style.fontWeight = computed.fontWeight;
          probe.style.fontStyle = computed.fontStyle;
          probe.style.letterSpacing = computed.letterSpacing;
          probe.style.fontSize = `${max}px`;
          document.body.appendChild(probe);

          const width = probe.scrollWidth || 1;
          probe.remove();

          const nextSize = Math.max(min, Math.min(max, Math.floor(max * (parentWidth - 2) / width)));
          setMeasuredSize((current) => current === nextSize ? current : nextSize);
        };

        fit();
        const observer = new ResizeObserver(fit);
        observer.observe(element.parentElement || element);
        window.addEventListener("resize", fit);
        return () => {
          observer.disconnect();
          window.removeEventListener("resize", fit);
        };
      }, [text, max, min, className]);

      return (
        <Tag
          ref={ref}
          className={`fit-title ${className}`}
          style={{
            ...style,
            "--fit-fallback": `clamp(${min}px, ${vw}vw, ${max}px)`,
            fontSize: measuredSize ? `${measuredSize}px` : style.fontSize
          }}
          title={text}
        >
          {text}
        </Tag>
      );
    }

    }

    function loadWatchedIds(storageKey) {
      const next = safeJson(localStorage.getItem(storageKey), null);
      return Array.isArray(next) ? next : [];
    }

    // 【統合の目印】=LOVE版のみ、旧バージョン（v5以前）のローカルストレージ形式からの
    // 移行ロジックを保持する。≠ME/≒JOYには該当する旧データが存在しないため不要。
    function loadLoveWatchedIdsWithLegacyMigration(storageKey) {
      const next = safeJson(localStorage.getItem(storageKey), null);
      if (Array.isArray(next)) {
        return next;
      }

      const legacyPairs = [
        ["watched_iori_v5", "iori"],
        ["watched_hana_v5", "hana"],
        ["watched_maika_v5", "maika"]
      ];

      const migrated = new Set();
      legacyPairs.forEach(([key, memberId]) => {
        safeJson(localStorage.getItem(key), []).forEach((legacyId) => {
          const offset = memberId === "iori" ? 0 : memberId === "hana" ? 15 : 30;
          const localIndex = Number(legacyId) - offset;
          if (Number.isInteger(localIndex) && localIndex >= 1 && localIndex <= 15) {
            migrated.add(`${memberId}-${localIndex}`);
          }
        });
      });
      return Array.from(migrated);
    }

    function safeJson(value, fallback) {
      try {
        return value ? JSON.parse(value) : fallback;
      } catch {
        return fallback;
      }
    }

    function memberProgress(memberId, watchedIds) {
      const total = VIDEO_DATA.filter((video) => video.memberId === memberId).length;
      const watched = VIDEO_DATA.filter((video) => video.memberId === memberId && watchedIds.includes(video.id)).length;
      return { total, watched, percent: total ? Math.round((watched / total) * 100) : 0 };
    }

    function BreakableTitle({ title, as: Tag = "span", className = "" }) {
      const match = title.match(/^(.*?)([（(].*)$/);
      if (!match) return <Tag className={className}>{title}</Tag>;
      return (
        <Tag className={className}>
          <span className="block">{match[1].trim()}</span>
          <span className="block">{match[2].trim()}</span>
        </Tag>
      );
    }

    function Thumbnail({ video }) {
      const [src, setSrc] = useState(`https://i.ytimg.com/vi/${video.youtubeId}/maxresdefault.jpg`);
      const [loaded, setLoaded] = useState(false);
      useEffect(() => {
        setLoaded(false);
        setSrc(`https://i.ytimg.com/vi/${video.youtubeId}/maxresdefault.jpg`);
      }, [video.youtubeId]);
      return (
        <div className={`thumb relative aspect-video overflow-hidden rounded-[8px] bg-zinc-200 shadow-[0_18px_42px_rgba(var(--ink-rgb),0.10)] ${loaded ? "is-loaded" : ""}`}>
          <span className="thumb-shimmer" aria-hidden="true"></span>
          <img
            src={src}
            alt={`${video.title}のサムネイル`}
            loading="lazy"
            className={`h-full w-full object-cover transition-all duration-500 group-hover:scale-105 ${loaded ? "opacity-100" : "opacity-0"}`}
            onLoad={(event) => {
              // 【バグ修正の目印】maxresdefaultが存在しない動画の場合、YouTubeはエラーではなく
              // 120×90の灰色プレースホルダー画像をHTTP 200で返すため、onErrorが発火しない。
              // 読み込み後の実サイズがプレースホルダーサイズと一致する場合はhqdefaultへ切り替える。
              const img = event.currentTarget;
              if (img.naturalWidth <= 120 && img.naturalHeight <= 90 && !src.includes("hqdefault")) {
                setSrc(`https://i.ytimg.com/vi/${video.youtubeId}/hqdefault.jpg`);
                return;
              }
              setLoaded(true);
            }}
            onError={() => {
              if (!src.includes("hqdefault")) {
                setSrc(`https://i.ytimg.com/vi/${video.youtubeId}/hqdefault.jpg`);
              }
            }}
          />
        </div>
      );
    }

    function LegacyTopNav({ member, setMember, page, setPage, view, setView, resetFilters, group, setGroup, brandName, brandSubtitle }) {

      const [menuOpen, setMenuOpen] = useState(false);
      const viewLabel = {
        home: "Top",
        privacy: "Policy"

      const currentLocation = view === "member"
        ? `${current.name.replace(" ", "")} / ${page === "about" ? "Profile" : "Archive"}`
        : viewLabel[view] || "Guide";

      useEffect(() => {
        if (!menuOpen) return undefined;
        const handleKeyDown = (event) => {
          if (event.key === "Escape") setMenuOpen(false);
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [menuOpen]);

      const closeAndScroll = () => {
        setMenuOpen(false);
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const goHome = () => {
        runUiTransition(() => setView("home"));
        closeAndScroll();
      };

      const goMemberPage = (nextPage) => {
        runUiTransition(() => {
          setView("member");
          setPage(nextPage);
          if (nextPage === "works") resetFilters();
        });
        closeAndScroll();
      };

        runUiTransition(() => setView(nextView));
        closeAndScroll();
      };

      const chooseMember = (id) => {
        const nextPage = view === "member" ? page : "works";
        runUiTransition(() => {
          setMember(id);
          setView("member");
          setPage(nextPage);
          if (nextPage === "works") resetFilters();

                <div className="mb-6 flex flex-wrap items-center justify-between gap-3">

                  </section>

            </div>
          )}
        </>

      );
    }

    function MemberHero({ current, progress, memberVideos }) {
      const issueNo = String(MEMBERS.findIndex((m) => m.id === current.id) + 1).padStart(2, "0");
      return (
        <header className="mx-auto mb-16 max-w-6xl px-1 md:mb-24">
          <div className="grid gap-10 border-b-2 border-[var(--ink)] pb-10 md:grid-cols-[1.5fr_1fr] md:gap-16 md:pb-14">
            <div className="min-w-0">
              <span className="editorial-kicker fluid-label">Issue No.{issueNo} / Recommended</span>
              <FitTitle text={current.name.replace(" ", "")} as="h1" max={92} min={40} className="mt-6 font-serif font-bold text-[var(--ink)]" />
              <p className="mt-2 fluid-caption font-bold tracking-[0.1em] text-[var(--muted)]">{current.en}</p>
              <p className="editorial-pullquote readable-ja mt-8 max-w-2xl text-[clamp(1.35rem,1rem+1.4vw,2rem)] leading-snug text-[var(--ink)]">
                “{current.catchcopy}”
              </p>
              <div className="mt-8 flex flex-wrap gap-2">
                <span className="status-pill fluid-label font-bold">{current.status || "現メンバー"}</span>
                {current.notes.map((note) => <span key={note} className="soft-chip fluid-label font-bold">#{note}</span>)}
              </div>
            </div>

            <div className="self-end">
              <div className="editorial-fact-row">
                <dt className="fluid-label font-bold tracking-[0.16em] text-[var(--gold)]">GUIDE</dt>
                <dd className="font-display text-3xl font-black italic leading-none text-[var(--ink)]">{memberVideos.length}本</dd>
              </div>
              <div className="editorial-fact-row">
                <dt className="fluid-label font-bold tracking-[0.16em] text-[var(--gold)]">WATCHED</dt>
                <dd className="font-display text-3xl font-black italic leading-none" style={{ color: memberColor(current) }}>{progress.percent}%</dd>
              </div>
              <div className="editorial-fact-row">
                <dt className="fluid-label font-bold tracking-[0.16em] text-[var(--gold)]">COLOR</dt>
                <dd className="flex items-center gap-2 text-sm font-bold text-[var(--ink)]">
                  <span className="block h-2.5 w-2.5 rounded-full" style={{ background: memberAccent(current) }}></span>
                  {current.colorName}
                </dd>
              </div>
              <div className="editorial-fact-row">
                <dt className="fluid-label font-bold tracking-[0.16em] text-[var(--gold)]">PROFILE</dt>
                <dd className="text-sm font-bold text-[var(--ink)]">{current.place} / {current.height}</dd>
              </div>
            </div>
          </div>
        </header>
      );
    }

    function LegacyFilterBar({ searchQuery, setSearchQuery, selectedType, setSelectedType, selectedTag, setSelectedTag, showWatchedOnly, setShowWatchedOnly, resetFilters, filteredCount }) {
      return (
        <section className="filter-panel relative z-10 mb-16 px-4 py-5 md:px-6">
          <div className="mx-auto mb-4 flex max-w-6xl flex-wrap items-center justify-between gap-3">
            <p className="fluid-label font-bold tracking-[0.16em] text-[var(--gold)]">絞り込み</p>
            <p className="rounded-full bg-white/80 px-3 py-1 fluid-label font-bold text-[var(--muted)] shadow-[0_8px_24px_rgba(249,118,159,0.10)]">{filteredCount}件表示中</p>
          </div>
          <div className="mx-auto grid max-w-6xl gap-4 md:grid-cols-[1.2fr_0.7fr_0.7fr_auto_auto] md:items-end">
            <label className="block">
              <span className="mb-1 block text-[10px] font-bold tracking-[0.18em] text-[var(--gold)]">さがす</span>
              <input
                value={searchQuery}
                onChange={(event) => setSearchQuery(event.target.value)}
                placeholder="タイトル・コメントで検索"
                className="filter-control h-10 w-full text-sm font-bold text-[var(--ink)] placeholder:text-zinc-300"
              />
            </label>
            <label className="block">
              <span className="mb-1 block text-[10px] font-bold tracking-[0.18em] text-[var(--gold)]">種類</span>
              <select value={selectedType} onChange={(event) => setSelectedType(event.target.value)} className="filter-control h-10 w-full text-sm font-bold text-[var(--ink)]">
                {TYPES.map((type) => <option key={type} value={type}>{type}</option>)}
              </select>
            </label>
            <label className="block">
              <span className="mb-1 block text-[10px] font-bold tracking-[0.18em] text-[var(--gold)]">タグ</span>
              <select value={selectedTag} onChange={(event) => setSelectedTag(event.target.value)} className="filter-control h-10 w-full text-sm font-bold text-[var(--ink)]">
                {TAGS.map((tag) => <option key={tag} value={tag}>{tag}</option>)}
              </select>
            </label>
            <label className="flex h-10 items-center gap-2 text-xs font-bold tracking-[0.12em] text-[var(--muted)]">
              <input type="checkbox" checked={showWatchedOnly} onChange={(event) => setShowWatchedOnly(event.target.checked)} className="h-4 w-4 accent-[var(--gold)]" />
              視聴済み
            </label>
            <button onClick={resetFilters} className="h-10 border-b border-[var(--gold)] px-1 text-xs font-bold tracking-[0.16em] text-[var(--ink)] transition-opacity hover:opacity-50">
              リセット
            </button>
          </div>
        </section>
      );
    }

    function LegacyVideoGrid({ videos, current, watchedIds, markWatched }) {
      if (videos.length === 0) {
        return (
          <div className="mx-auto max-w-3xl rounded-[8px] border border-[var(--border-soft)] bg-white p-12 text-center shadow-[0_18px_45px_rgba(249,118,159,0.10)]">
            <p className="font-serif text-2xl font-bold text-[var(--ink)]">該当する動画がありません</p>
            <p className="mt-3 text-sm font-normal leading-7 text-zinc-500">検索語や絞り込みを少しゆるめて、もう一度探してみてください。</p>
          </div>
        );
      }

      return (
        <div className="mx-auto max-w-6xl border-t-2 border-[var(--ink)]">
          {videos.map((video, index) => {
            const watched = watchedIds.includes(video.id);
            return (
              <article key={video.id} className="editorial-row page-card grid grid-cols-[auto_auto_1fr] items-center gap-4 px-1 py-6 md:grid-cols-[auto_auto_1.3fr_1.4fr_auto] md:gap-6 md:px-2" style={{ "--stagger": `${Math.min(index, 8) * 36}ms` }}>
                <span className="editorial-index-num hidden text-3xl md:block" style={{ WebkitTextStrokeColor: `${current.hexColor}55` }}>
                  {String(index + 1).padStart(2, "0")}
                </span>

                <a href={video.url} target="_blank" rel="noreferrer" onClick={() => markWatched(video.id)} className="group relative block h-16 w-28 shrink-0 overflow-hidden md:h-[4.5rem] md:w-32" aria-label={`${video.title}をYouTubeで観る`}>
                  <Thumbnail video={video} />
                  <span className="play-badge" style={{ background: memberAccent(current, 135) }}>
                    <Icon name="play" className="h-4 w-4 translate-x-0.5" />
                  </span>
                </a>

                <div className="min-w-0">
                  <div className="flex items-center gap-3 fluid-label font-bold tracking-[0.1em] text-[var(--gold)]">
                    <span className="uppercase">{video.type}</span>
                    <span className="text-zinc-300">·</span>
                    <span>{video.watchPoint}</span>
                  </div>
                  <BreakableTitle title={video.title} as="h3" className="mt-1 font-serif text-lg font-bold leading-snug text-[var(--ink)] transition-colors md:text-xl" />
                  <span className="mt-1 block text-xs font-bold text-zinc-300">{video.date}</span>
                </div>

                <p className="readable-ja hidden min-w-0 line-clamp-2 fluid-caption font-normal leading-8 text-zinc-500 md:block">{video.comment}</p>

                <div className="col-span-3 flex items-center justify-between gap-3 md:col-span-1 md:flex-col md:items-end md:gap-2">
                  <div className="hidden flex-wrap justify-end gap-2 fluid-label font-bold tracking-[0.06em] md:flex">
                    {video.tags.slice(0, 2).map((tag) => <span key={tag} className="soft-chip">#{tag}</span>)}
                  </div>
                  <div className="flex items-center gap-2">
                    <a href={video.url} target="_blank" rel="noreferrer" onClick={() => markWatched(video.id)} className={`inline-flex items-center gap-1.5 border-b-2 pb-0.5 fluid-label font-bold tracking-[0.1em] text-[var(--ink)] transition hover:opacity-60 ${isMonoMember(current) ? "" : ""}`} style={{ borderColor: memberAccent(current) }} data-member-action={current.id}>
                      観る
                      <Icon name="play" className="h-3 w-3" />
                    </a>
                    {watched && (
                      <span
                        className="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-base text-white"
                        style={{ background: memberAccent(current, 135) }}
                        title="視聴済み"
                        aria-label="視聴済み"
                      >
                        ✓
                      </span>
                    )}
                  </div>
                </div>
              </article>
            );
          })}
        </div>
      );
    }

    function LegacyProfile({ current, videos }) {
      const issueNo = String(MEMBERS.findIndex((m) => m.id === current.id) + 1).padStart(2, "0");
      return (
        <div className="mx-auto max-w-6xl animate-in">
          <div className="flex flex-col gap-16 border-t-2 border-[var(--ink)] pt-10 md:flex-row md:gap-20 md:pt-14">
            <div className="space-y-10 md:w-5/12">
              <div>
                <p className="editorial-kicker fluid-label">Issue No.{issueNo} / Profile</p>
                <FitTitle text={current.name.replace(" ", "")} as="h2" max={64} min={30} className="mt-5 font-serif font-bold" style={{ color: memberColor(current) }} />
                <p className="mt-3 text-sm font-bold text-[var(--muted)]">{current.en}</p>
              </div>
              <dl>
                <div className="editorial-fact-row"><dt className="fluid-label font-bold tracking-[0.12em] text-gold">ステータス</dt><dd className="text-right text-sm font-bold">{current.status || "現メンバー"}</dd></div>
                <div className="editorial-fact-row"><dt className="fluid-label font-bold tracking-[0.12em] text-gold">メンバーカラー</dt><dd className="text-right text-sm font-bold">{current.colorName}</dd></div>
                <div className="editorial-fact-row"><dt className="fluid-label font-bold tracking-[0.12em] text-gold">誕生日</dt><dd className="text-right text-sm font-bold">{current.birth}</dd></div>
                <div className="editorial-fact-row"><dt className="fluid-label font-bold tracking-[0.12em] text-gold">血液型 / 星座</dt><dd className="text-right text-sm font-bold">{current.blood} / {current.sign}</dd></div>
                <div className="editorial-fact-row"><dt className="fluid-label font-bold tracking-[0.12em] text-gold">身長 / 出身地</dt><dd className="text-right text-sm font-bold">{current.height} / {current.place}</dd></div>
                <div className="editorial-fact-row"><dt className="fluid-label font-bold tracking-[0.12em] text-gold">おすすめ</dt><dd className="text-right text-sm font-bold">{videos.length}本</dd></div>
              </dl>
              <div className="space-y-4 border-l-2 pl-5" style={{ borderColor: memberAccent(current) }}>
                <p className="fluid-label font-bold tracking-[0.16em] text-[var(--gold)]">公式プロフィールから拾える入口</p>
                <dl className="space-y-3 text-sm leading-7 text-[#6f5963]">
                  <div>
                    <dt className="font-bold text-[var(--ink)]">趣味</dt>
                    <dd>{current.hobby}</dd>
                  </div>
                  <div>
                    <dt className="font-bold text-[var(--ink)]">特技</dt>
                    <dd>{current.skill}</dd>
                  </div>
                  {current.qualification && (
                    <div>
                      <dt className="font-bold text-[var(--ink)]">資格</dt>
                      <dd>{current.qualification}</dd>
                    </div>
                  )}
                </dl>
              </div>
              <div className="space-y-3">
                <p className="font-serif text-xl font-bold" style={{ color: memberColor(current) }}>好きポイント</p>
                <div className="flex flex-wrap gap-2">
                  {current.notes.map((note) => (
                    <span key={note} className="soft-chip fluid-label font-bold">#{note}</span>
                  ))}
                </div>
              </div>
              <div className="space-y-3 border-t pt-8" style={{ borderColor: "var(--line-soft)" }}>
                <p className="font-serif text-xl font-bold" style={{ color: memberColor(current) }}>公式SNS・公開コンテンツ</p>
                <div className="grid gap-2">
                  {current.socials.map((social) => (
                    <a key={social.label} href={social.url} target="_blank" rel="noreferrer" className="editorial-row flex items-center justify-between border-t-0 px-1 py-3 text-sm font-bold tracking-[0.06em] text-[var(--ink)] transition-opacity hover:opacity-60">
                      <span>{social.label}</span>
                      <span style={{ color: current.hexColor }}>→</span>
                    </a>
                  ))}
                </div>
              </div>
            </div>
            <div className="md:w-7/12">
              <p className="editorial-pullquote readable-ja text-[clamp(1.5rem,1.05rem+1.7vw,2.35rem)] leading-snug text-[var(--ink)]">
                “{current.catchcopy}”
              </p>
              <p className="readable-ja mt-8 fluid-copy font-normal leading-[2.25] text-zinc-600">{current.profile}</p>
              <div className="mt-10 border-t-2 border-[var(--ink)] pt-6">
                <p className="mb-1 fluid-label font-bold tracking-[0.16em] text-[var(--gold)]">まず観たい3本</p>
                {videos.slice(0, 3).map((video, index) => (
                  <a key={video.id} href={video.url} target="_blank" rel="noreferrer" className="editorial-row flex items-center gap-4 px-1 py-4 text-sm transition-opacity hover:opacity-60">
                    <span className="editorial-index-num text-2xl" style={{ WebkitTextStrokeColor: `${current.hexColor}55` }}>{String(index + 1).padStart(2, "0")}</span>
                    <BreakableTitle title={video.title} className="min-w-0 flex-1 font-bold leading-snug text-[var(--ink)]" />
                    <span className="shrink-0 fluid-label font-black uppercase tracking-widest text-zinc-300">{video.type}</span>
                  </a>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function LegacyFooter({ setView, singleTheme, brandName }) {
      return (
        <footer className="relative mt-24 overflow-hidden border-t border-[var(--border-soft)] px-8 py-24 text-center md:py-32" style={{ background: "linear-gradient(180deg, var(--paper) 0%, var(--paper2) 100%)" }}>
          <div className="relative z-10 space-y-8">
            <p className="mx-auto max-w-2xl fluid-caption font-normal leading-7 tracking-[0.06em] text-[var(--muted)]">
              {brandName}を好きになった瞬間を、少しずつ集めていける非公式ファンページです。
            </p>
            {singleTheme && (
              <p className="mx-auto max-w-2xl fluid-caption font-normal tracking-[0.04em] text-[#8a8074]">
                本日のテーマカラー：「{singleTheme.title}」（{singleTheme.year}）のジャケットより
              </p>
            )}
            <div className="mx-auto grid max-w-3xl gap-3 md:grid-cols-2">
              <a href="https://twitter.com/eyes_takamatsu" target="_blank" rel="noreferrer" className="section-card p-5 text-left transition hover:-translate-y-1">
                <p className="fluid-label font-bold tracking-[0.16em] text-[var(--gold)]">総合管理者</p>
                <p className="mt-2 font-serif text-2xl font-bold text-[var(--ink)]">あお</p>
                <p className="mt-2 fluid-label font-bold text-[var(--muted)]">X: @eyes_takamatsu</p>
              </a>
              <a href="https://twitter.com/iohana_momiji" target="_blank" rel="noreferrer" className="section-card p-5 text-left transition hover:-translate-y-1">
                <p className="fluid-label font-bold tracking-[0.16em] text-[var(--gold)]">技術協力</p>
                <p className="mt-2 font-serif text-2xl font-bold text-[var(--ink)]">いろは紅葉</p>
                <p className="mt-2 fluid-label font-bold text-[var(--muted)]">X: @iohana_momiji</p>
              </a>
            </div>
            <button onClick={() => { runUiTransition(() => setView("privacy")); window.scrollTo({ top: 0, behavior: "smooth" }); }} className="border-b border-[var(--gold)] pb-1 fluid-label font-bold tracking-[0.18em] text-[var(--muted)] transition hover:text-[var(--ink)]">
              プライバシーポリシー
            </button>
          </div>
        </footer>
      );
    }

    function App() {
      const [group, setGroupState] = useState("love");
      activateGroup(group);
      const G = GROUP_REGISTRY[group];

      const [view, setView] = useState("home");
      const [page, setPage] = useState("works");
      const [member, setMember] = useState(G.defaultMemberId);
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedType, setSelectedType] = useState("すべて");
      const [selectedTag, setSelectedTag] = useState("すべて");
      const [showWatchedOnly, setShowWatchedOnly] = useState(false);
      // 【統合の目印】「視聴済み」はグループごとに別々のローカルストレージキーへ保存する。
      // watchedByGroup はグループIDをキーに持つオブジェクトで、3グループ分のIDリストを
      // 同時に保持しておくことで、グループを切り替えても各グループの記録が失われない。
      const [watchedByGroup, setWatchedByGroup] = useState(() => ({
        love: GROUP_REGISTRY.love.loadWatched(),
        noimi: GROUP_REGISTRY.noimi.loadWatched(),
        joy: GROUP_REGISTRY.joy.loadWatched()
      }));
      const watchedIds = watchedByGroup[group];
      const [singleTheme, setSingleTheme] = useState(() => GROUP_REGISTRY.love.pickSingleTheme());

      // グループ切替時：CSS変数（ブランドカラー）の適用、対象メンバー・表示状態の初期化、
      // 単曲テーマカラーの再抽選、ブラウザタブのタイトル更新を行う。
      useEffect(() => {
        applyGroupCssVars(G.theme);
        document.title = G.pageTitle;
        setSingleTheme(G.pickSingleTheme());
        const metaThemeColor = document.getElementById("meta-theme-color");
        if (metaThemeColor) metaThemeColor.setAttribute("content", G.theme.gold);
      }, [group]);

      const setGroup = (nextGroup) => {
        if (nextGroup === group) return;
        runUiTransition(() => {
          setGroupState(nextGroup);
          setMember(GROUP_REGISTRY[nextGroup].defaultMemberId);
          setView("home");
          setPage("works");
          setSearchQuery("");
          setSelectedType("すべて");
          setSelectedTag("すべて");
          setShowWatchedOnly(false);
        });
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      useEffect(() => {
        // 【統合の目印】3グループ分の「視聴済み」記録を、それぞれ専用のローカルストレージキーへ保存する。
        GROUP_ORDER.forEach((gid) => {
          localStorage.setItem(GROUP_REGISTRY[gid].storageKey, JSON.stringify(watchedByGroup[gid]));
        });
      }, [watchedByGroup]);

      useEffect(() => {
        // アクセスごとに歴代シングルジャケットから1色を選び、アクセントカラーに適用する。
        // 背景（--paper）と本文色（--ink）は固定のまま、リンクや強調表示のトーンだけが変わる。
        const root = document.documentElement.style;
        root.setProperty("--site-pink", singleTheme.accent);
        root.setProperty("--site-gold", singleTheme.accent);
        root.setProperty("--line-strong", singleTheme.accent + "3d");
      }, [singleTheme]);

      const current = MEMBER_BY_ID[member];
      const memberVideos = useMemo(() => VIDEO_DATA.filter((video) => video.memberId === member), [member]);
      const progress = memberProgress(member, watchedIds);

      const filteredVideos = useMemo(() => {
        const normalized = searchQuery.trim().toLowerCase();
        return memberVideos.filter((video) => {
          const text = `${video.title} ${video.comment} ${video.type} ${video.tags.join(" ")} ${current.name} ${current.en}`.toLowerCase();
          if (selectedType !== "すべて" && video.type !== selectedType) return false;
          if (selectedTag !== "すべて" && !video.tags.includes(selectedTag)) return false;
          if (showWatchedOnly && !watchedIds.includes(video.id)) return false;
          if (normalized && !text.includes(normalized)) return false;
          return true;
        });
      }, [searchQuery, selectedType, selectedTag, showWatchedOnly, watchedIds, memberVideos, current]);

      // 【仕様変更の目印】「視聴済み」は手動ボタンでの入力を廃止し、「観る」リンク
      // （YouTubeを開く操作）をクリックした時点でブラウザ内（ローカルストレージ）に
      // 自動で記録する方式のみとした。視聴済みの動画には非interactiveなチェックバッジを表示する。
      const markWatched = (id) => {
        setWatchedByGroup((prev) => {
          const list = prev[group];
          if (list.includes(id)) return prev;
          return { ...prev, [group]: [...list, id] };
        });
      };

      const resetFilters = () => {
        setSearchQuery("");
        setSelectedType("すべて");
        setSelectedTag("すべて");
        setShowWatchedOnly(false);
      };

      return (
        <div className="app-shell dual-bg selection:bg-deep selection:text-white">
          <LegacyTopNav
            member={member}
            setMember={setMember}
            page={page}
            setPage={setPage}
            view={view}
            setView={setView}
            resetFilters={resetFilters}
            group={group}
            setGroup={setGroup}
            brandName={G.brandName}
            brandSubtitle={G.navSubtitle}
          />
          {view === "member" && <LegacyProgress current={current} progress={progress} page={page} />}

          {view === "home" && (
            <HomeMemberIndex setMember={setMember} setPage={setPage} setView={setView} resetFilters={resetFilters} watchedIds={watchedIds} brandName={G.brandName} homeIntro={G.homeIntro} />
          )}

          {view === "privacy" && (
            <PrivacyPolicy setView={setView} brandName={G.brandName} privacyExternalServices={G.privacyExternalServices} />
          )}

          {view === "member" && (
          <main className="page-transition mx-auto max-w-7xl px-6 pb-8 pt-40 md:pt-44">
            <nav className="member-page-tabs mb-8 flex items-center gap-2" aria-label="動画 / プロフィール切り替え">
              <button
                onClick={() => runUiTransition(() => { setPage("works"); resetFilters(); })}
                className={`member-page-tab ${page === "works" ? "is-active" : ""}`}
                style={page === "works" ? { borderColor: memberColor(current), color: memberColor(current) } : undefined}
              >
                動画
              </button>
              <button
                onClick={() => runUiTransition(() => setPage("about"))}
                className={`member-page-tab ${page === "about" ? "is-active" : ""}`}
                style={page === "about" ? { borderColor: memberColor(current), color: memberColor(current) } : undefined}
              >
                プロフィール
              </button>
            </nav>
            {page === "works" && (
              <div key={`${member}-works`} className="animate-in">
                <MemberHero current={current} progress={progress} memberVideos={memberVideos} />
                <LegacyFilterBar
                  searchQuery={searchQuery}
                  setSearchQuery={setSearchQuery}
                  selectedType={selectedType}
                  setSelectedType={setSelectedType}
                  selectedTag={selectedTag}
                  setSelectedTag={setSelectedTag}
                  showWatchedOnly={showWatchedOnly}
                  setShowWatchedOnly={setShowWatchedOnly}
                  resetFilters={resetFilters}
                  filteredCount={filteredVideos.length}
                />
                <LegacyVideoGrid videos={filteredVideos} current={current} watchedIds={watchedIds} markWatched={markWatched} />
                <SourceNote />
              </div>
            )}

            {page === "about" && (
              <div key={`${member}-about`} className="animate-in">
                <LegacyProfile current={current} videos={memberVideos} />
                <SourceNote />
              </div>
            )}
          </main>
          )}
          <LegacyFooter setView={setView} singleTheme={singleTheme} brandName={G.brandName} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
